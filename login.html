<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Franjo Torres</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Franklin:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#080808;--panel:#141414;--line:#2a2a2a;
  --ink:#f0f0f0;--muted:#888;--gold:#C4973A;--gold2:#d4a94a;
  --red:#ef5350;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 450px at 50% -10%,rgba(196,151,58,.08),transparent 60%);
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  padding:24px;
}

.card{
  width:100%;max-width:400px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:40px 36px;
}

.logo{
  display:flex;flex-direction:column;align-items:center;
  gap:6px;margin-bottom:36px;text-align:center;
}
.logo-icon{font-size:32px;line-height:1}
.logo-name{
  font-family:'Libre Franklin',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
}
.logo-sub{font-size:12px;color:var(--muted);letter-spacing:.04em}

h1{
  font-family:'Libre Franklin',sans-serif;font-size:20px;font-weight:800;
  text-align:center;margin-bottom:28px;letter-spacing:-.01em;
}

.field{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
input{
  width:100%;background:#1c1c1c;border:1px solid var(--line);
  border-radius:8px;padding:12px 14px;color:var(--ink);
  font-size:15px;font-family:'Inter',sans-serif;outline:none;
  transition:border-color .15s;
}
input:focus{border-color:var(--gold)}
input::placeholder{color:#444}

.btn{
  width:100%;margin-top:8px;
  background:var(--gold);color:#000;
  border:none;border-radius:8px;padding:13px;
  font-size:14px;font-weight:700;font-family:'Inter',sans-serif;
  letter-spacing:.04em;cursor:pointer;transition:background .15s,opacity .15s;
}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.error{
  background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.3);
  border-radius:8px;padding:10px 14px;
  font-size:13px;color:var(--red);margin-top:16px;
  display:none;
}
.error.show{display:block}

.loading{
  display:none;flex-direction:column;align-items:center;
  gap:12px;padding:40px 0;text-align:center;
}
.loading.show{display:flex}
.loading p{font-size:14px;color:var(--muted)}

.spinner{
  width:32px;height:32px;
  border:3px solid var(--line);border-top-color:var(--gold);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.form-content{}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🥗</div>
    <div class="logo-name">Franjo Torres</div>
    <div class="logo-sub">Nutricionista · Entrenamiento</div>
  </div>

  <div class="form-content" id="formContent">
    <h1>Tu plan personalizado</h1>
    <form id="loginForm">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Iniciar sesión</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <p>Cargando tu plan…</p>
  </div>
</div>

<script>
const SUPABASE_URL  = 'https://hmnjtbruliluctslkndq.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhtbmp0YnJ1bGlsdWN0c2xrbmRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NjAxNjksImV4cCI6MjA5NzAzNjE2OX0.IYmCcvjdlbH1L0QoSoGIpwudRehSQINR1hNoWG02Cc4';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const formContent  = document.getElementById('formContent');
const loadingState = document.getElementById('loadingState');
const loginForm    = document.getElementById('loginForm');
const submitBtn    = document.getElementById('submitBtn');
const errorMsg     = document.getElementById('errorMsg');

function showLoading() {
  formContent.style.display = 'none';
  loadingState.classList.add('show');
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.add('show');
  submitBtn.disabled = false;
}

async function loadPlan(session) {
  showLoading();
  try {
    const { data: profile, error } = await sb
      .from('patient_profiles')
      .select('slug')
      .eq('user_id', session.user.id)
      .single();

    if (error || !profile?.slug) {
      formContent.style.display = '';
      loadingState.classList.remove('show');
      showError('No se encontró tu perfil. Escríbele a tu nutricionista.');
      return;
    }

    const res = await fetch(`/paciente/${profile.slug}.html`);
    if (!res.ok) throw new Error('Página no encontrada');
    const html = await res.text();

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    formContent.style.display = '';
    loadingState.classList.remove('show');
    showError('Error al cargar tu plan. Intenta de nuevo.');
  }
}

// Si ya hay sesión activa, cargar plan directamente
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await loadPlan(session);
})();

// Submit del formulario
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Verificando…';

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await loadPlan(data.session);
  } catch (err) {
    const msg = err.message?.includes('Invalid login credentials')
      ? 'Correo o contraseña incorrectos.'
      : (err.message || 'Error al iniciar sesión.');
    showError(msg);
    submitBtn.textContent = 'Iniciar sesión';
  }
});
</script>
</body>
</html>
