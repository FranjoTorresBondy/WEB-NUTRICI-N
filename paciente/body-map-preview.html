<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;padding:24px 0}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.sec-h{display:flex;align-items:baseline;gap:16px;margin:8px 0 20px}
.sec-h h2{font-family:'Libre Franklin',sans-serif;font-weight:600;font-size:22px}
.sec-h .ix{font-family:'IBM Plex Mono';color:var(--navy);font-size:13px;font-weight:600}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.note{font-size:12px;color:var(--faint);margin-top:24px;text-align:center}
</style>
</head>
