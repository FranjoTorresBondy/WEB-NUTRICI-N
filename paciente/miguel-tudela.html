*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;

header.hero{padding:60px 0 22px}

h1{font-family:'Chakra Petch',sans-serif;font-weight:700;line-height:1.02;font-size:clamp(40px,7vw,84px);margin:14px 0 6px;color:#fff;letter-spacing:.02em;text-transform:uppercase}
.subhead{display:flex;flex-wrap:wrap;gap:8px 26px;color:var(--muted);font-size:14px;margin-top:14px}

.tabbar{position:sticky;top:0;z-index:20;background:rgba(8,8,8,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:24px}

.tab{appearance:none;background:none;border:none;cursor:pointer;font-family:'Inter';font-weight:600;font-size:14px;letter-spacing:.01em;color:var(--muted);padding:17px 22px;position:relative;transition:color .25s;display:flex;align-items:center;gap:10px;flex-shrink:0;white-space:nowrap}

.tab.active{color:var(--navy)}

.panel.active{display:block}

section{padding:30px 0}

.sec-h h2{font-family:'Libre Franklin',sans-serif;font-weight:600;font-size:24px}

.macros .kcal{font-family:'Libre Franklin',sans-serif;font-weight:600;font-size:32px;color:var(--amber)}
.macros .kcal small{font-size:14px;color:var(--muted);font-family:'Inter';font-weight:600}
.macros .mtag{font-family:'IBM Plex Mono';font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--ink)}

.macros .sep{flex:1}
.tag{display:inline-block;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#000;background:var(--navy);padding:5px 12px;border-radius:999px;font-weight:700}
.plan-sel{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.planbtn{appearance:none;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 16px;color:var(--muted);font-family:'Inter';font-size:13px;font-weight:600;text-align:left;transition:.2s;box-shadow:var(--shadow)}
.planbtn:hover{border-color:var(--muted);color:var(--ink)}
.planbtn.active{border-color:var(--navy);color:var(--ink);background:var(--panel2)}
.planbtn.active .pn{color:var(--navy)}
.pn{font-family:'Libre Franklin',sans-serif;font-weight:700;font-size:15px;display:block;line-height:1.2}
.pp{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:4px;display:block}

.meal .top .nm{font-family:'Libre Franklin',sans-serif;font-weight:600;font-size:19px}
.meal .top .mac{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
.meal .top .mac b{color:var(--amber)}
.meal .body{padding:14px 20px 18px}
.pick{margin:10px 0}
.pick .k{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);font-weight:600;margin-bottom:6px}
.options{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;transition:.15s;border:1.5px solid transparent;font-size:12.5px;color:var(--muted);line-height:1.4;user-select:none}

.opt.selected{background:rgba(196,151,58,.1);border-color:rgba(196,151,58,.3);color:var(--ink)}

.opt.selected .cb{background:var(--navy);border-color:var(--navy);color:#000}
.opt-text{flex:1;min-width:0}
.opt-ctrl{display:flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0}
.opt-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;font-weight:600;line-height:1;padding:0}
.opt-btn:hover{border-color:var(--navy);color:var(--navy)}
.opt-btn:disabled{opacity:.25;cursor:default}
.opt-cnt{font-family:'IBM Plex Mono';font-size:14px;font-weight:700;min-width:20px;text-align:center;color:var(--navy)}
.meal .note2{font-size:11.5px;color:var(--faint);font-style:italic;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.evalwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:760px){.evalwrap{grid-template-columns:1fr}}
.evgroup{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.evgroup .gh{background:var(--panel2);padding:11px 16px;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.evgroup .row{display:flex;justify-content:space-between;padding:9px 16px;font-size:13px;border-top:1px solid var(--line)}

.evgroup .row span:last-child{font-family:'IBM Plex Mono';font-weight:600;color:var(--ink)}
.evgroup .row.bold span{font-weight:700}
.evgroup .row.bold span:last-child{color:var(--coral)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.obj li{font-size:13.5px;color:var(--ink);margin:8px 0 8px 4px;list-style:none;padding-left:22px;position:relative}

.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

.spec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}

.hcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;text-align:center;box-shadow:var(--shadow)}

.chart-card .cap{font-size:12px;color:var(--faint);margin-bottom:16px}
.chart-wrap{position:relative;height:220px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}

.kpi-row{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}

.kpi .kv{font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:var(--navy)}
.kpi .kl{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.eval-form{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:20px}
.eval-form h3{font-family:'Libre Franklin',sans-serif;font-weight:600;font-size:16px;color:var(--ink);margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.form-field label{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px}
.form-field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:'Libre Franklin',sans-serif;font-size:15px;font-weight:600}
.form-field input:focus{outline:none;border-color:var(--navy)}
.btn-add{margin-top:16px;background:var(--navy);color:#000;border:none;border-radius:10px;padding:10px 22px;font-family:'IBM Plex Mono';font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s}
.btn-add:hover{opacity:.85}
.antro-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:16px}
.antro-table th{background:var(--panel2);color:var(--faint);font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.antro-table th:first-child{text-align:left}
.antro-table td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;font-family:'IBM Plex Mono';color:var(--ink)}
.antro-table td:first-child{text-align:left;color:var(--muted)}
.antro-table tr:last-child td{border-bottom:none;color:var(--navy);font-weight:700}
.tbl-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
footer{padding:40px 0;border-top:1px solid var(--line);margin-top:20px}
.foot-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.foot-brand{font-family:'IBM Plex Mono';font-size:11px;color:var(--faint);letter-spacing:.1em}
.foot-contact{font-size:12px;color:var(--faint)}
@media(max-width:640px){
  .wrap{padding:0 16px}
  header.hero{padding:32px 0 16px}
  section{padding:20px 0}
  .tabbar .wrap{overflow-x:auto;padding:0 4px;scrollbar-width:none;-ms-overflow-style:none;flex-wrap:nowrap}
  .tabbar .wrap::-webkit-scrollbar{display:none}
  .tab{padding:13px 14px;font-size:12px;gap:6px}
  .tab.active::after{left:14px;right:14px}
  .macros{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px}
  .macros .sep{display:none}
  .macros .kcal{font-size:26px}
  .evalwrap,.specs{grid-template-columns:1fr}
}
</style>

function buildMeal(meal, planId) {
  var mealKey = planId + '-' + meal.id;
  var groups = meal.grupos.map(function(g, gi) {
    var opts = g.ops.map(function(op, oi) {
      var key = mealKey + '-' + gi + '-' + oi;
      var cnt = (mealState[key]||0);
      var sel = cnt > 0;
      var ctrl = g.max > 1 ?
        '<div class="opt-ctrl">' +
        '<button class="opt-btn" onclick="event.stopPropagation();adjOpt(this,-1)"' + (cnt<1?' disabled':'') + '>−</button>' +
        '<span class="opt-cnt">' + (cnt||0) + '</span>' +
        '<button class="opt-btn" onclick="event.stopPropagation();adjOpt(this,1)">+</button></div>' : '';
      return '<div class="opt' + (sel?' selected':'') + '" data-key="' + key + '" data-max="' + g.max + '" data-gi="' + gi + '" onclick="toggleOpt(this)">' +
        '<div class="cb">' + (sel?'✓':'') + '</div>' +
        '<span class="opt-text">' + op + '</span>' + ctrl + '</div>';
    }).join('');
    return '<div class="pick"><div class="k">' + g.label + '</div><div class="options">' + opts + '</div></div>';
  }).join('');
  var nota = meal.nota ? '<div class="note2">' + meal.nota + '</div>' : '';
  var macStr = meal.kcal != null ? '<b>' + meal.kcal + '</b> kcal · ' + meal.p + 'P / ' + meal.c + 'C / ' + meal.g + 'G' : '';
  return '<div class="meal" data-mealid="' + meal.id + '"><div class="top">' +
    '<span class="nm">' + meal.nombre + '</span>' +
    (macStr ? '<span class="mac">' + macStr + '</span>' : '') +
    '</div><div class="body">' + groups + nota + '</div></div>';
}

function toggleOpt(el) {
  if (!el.dataset.key) return;
  var key = el.dataset.key;
  var cur = mealState[key]||0;
  mealState[key] = cur>0 ? 0 : 1;
  saveMealState(mealState);
  renderNutr();
}

function adjOpt(btn, delta) {
  var opt = btn.closest('.opt');
  var key = opt.dataset.key;
  var cur = mealState[key]||0;
  mealState[key] = Math.max(0, cur+delta);
  saveMealState(mealState);
  renderNutr();
}

    '<div class="form-field"><label>Pantorrilla per.</label><input type="number" step="0.1" id="f-pantPer"></div>' +
    '</div><button class="btn-add" onclick="addAntroEntry()">+ Guardar medicion</button></div></section></div>';
  drawAntroCharts();
}

function drawAntroCharts() {
  var data=getAntroData(); var lbl=data.map(function(d){return d.fecha;});
  var first=data[0],last=data[data.length-1];
  var kpis=[
    {v:last.peso,u:'kg',l:'Peso actual',d:data.length>1?+(last.peso-first.peso).toFixed(1):null,good:'down'},
    {v:last.s8!=null?last.s8:'—',u:'mm',l:'Sigma 8 pliegues',d:null,good:'down'},
    {v:last.abdom!=null?last.abdom:'—',u:'cm',l:'Cintura',d:null,good:'down'},
    {v:last.brazFlex!=null?last.brazFlex:'—',u:'cm',l:'Brazo flexionado',d:null,good:'up'},
  ];
  $('antroKpis').innerHTML=kpis.map(function(k){
    var sign=k.d!=null&&k.d>0?'+':''; var arr=k.d!=null?(k.d>0?'▲':(k.d<0?'▼':'—')):'';
    return '<div class="kpi"><div class="kv">'+k.v+'<span style="font-size:14px;opacity:.5"> '+k.u+'</span></div>' +
      '<div class="kl">'+k.l+'</div>' + (k.d!=null?'<div style="font-size:12px;margin-top:4px;color:'+(k.d>0?'var(--coral)':'var(--green)')+'">'+arr+' '+sign+k.d+' '+k.u+'</div>':'') + '</div>';
  }).join('');
  mkChart('cPeso',lbl,[{label:'Peso kg',data:data.map(function(d){return d.peso;}),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cSigma',lbl,[{label:'Sigma 6',data:data.map(function(d){return d.s6;}),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Sigma 8',data:data.map(function(d){return d.s8;}),borderColor:CC.purple,pointBackgroundColor:CC.purple}]);
  mkChart('cMusc',lbl,[{label:'Brazo flex',data:data.map(function(d){return d.brazFlex;}),borderColor:CC.green,pointBackgroundColor:CC.green},{label:'Muslo',data:data.map(function(d){return d.muslo;}),borderColor:CC.cyan,pointBackgroundColor:CC.cyan},{label:'Pantorrilla',data:data.map(function(d){return d.pantPer;}),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cCint',lbl,[{label:'Cintura',data:data.map(function(d){return d.abdom;}),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Cadera',data:data.map(function(d){return d.cadera;}),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cPl',lbl,[{label:'Abdominal',data:data.map(function(d){return d.abd;}),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Cresta',data:data.map(function(d){return d.cresta;}),borderColor:CC.gold,pointBackgroundColor:CC.gold},{label:'Subescapular',data:data.map(function(d){return d.sub;}),borderColor:CC.cyan,pointBackgroundColor:CC.cyan}]);
  var cols=['fecha','peso','s6','s8','brazFlex','muslo','abdom','cadera'];
  var heads=['Fecha','Peso kg','Sigma6 mm','Sigma8 mm','Brazo cm','Muslo cm','Cintura cm','Cadera cm'];
  $('antroTable').innerHTML='<thead><tr>'+heads.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+
    [].concat(data).reverse().map(function(d){return '<tr>'+cols.map(function(c){return '<td>'+(d[c]!=null?d[c]:'—')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody>';
}

function addAntroEntry() {
  function gf(id){var e=$(id);return e?e.value||null:null;}
  function gn(id){var e=$(id);return e?parseFloat(e.value)||null:null;}
  var fecha=gf('f-fecha'); if(!fecha){alert('Ingresa la fecha');return;}
  var e={fecha:fecha.split('-').reverse().join('.'),peso:gn('f-peso'),tri:gn('f-tri'),bi:gn('f-bi'),sub:gn('f-sub'),cresta:gn('f-cresta'),supra:gn('f-supra'),abd:gn('f-abd'),pierna:gn('f-pierna'),pant:gn('f-pant'),brazRelaj:gn('f-brazRelaj'),brazFlex:gn('f-brazFlex'),abdom:gn('f-abdom'),cadera:gn('f-cadera'),muslo:gn('f-muslo'),pantPer:gn('f-pantPer')};
  var vals=[e.tri,e.sub,e.supra,e.abd,e.pierna,e.pant].filter(function(x){return x!=null;});
  e.s6=vals.length===6?+vals.reduce(function(a,b){return a+b;},0).toFixed(1):null;
  e.s8=e.s6!=null&&e.bi!=null&&e.cresta!=null?+(e.s6+e.bi+e.cresta).toFixed(1):null;
  var data=getAntroData(); data.push(e); saveAntroData(data);
  antroInited=false; initAntro();
  ['fecha','peso','tri','bi','sub','cresta','supra','abd','pierna','pant','brazRelaj','brazFlex','abdom','cadera','muslo','pantPer'].forEach(function(f){var el=$('f-'+f);if(el)el.value='';});
  flashSave();
}

function flashSave() {
  clearTimeout(saveTimer);
  var el=$('saveind'); el.classList.add('show'); $('saveTxt').textContent='Guardado';
  saveTimer=setTimeout(function(){el.classList.remove('show');},1800);
}

function init() {
  renderHero();
  renderTabs();
  renderNutr();
  renderEval();
  renderSpecs();
}
init();
</script>
