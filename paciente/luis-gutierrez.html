.meal .top .mac b{color:var(--amber)}

.pick{margin:10px 0}

.opt{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;transition:.15s;border:1.5px solid transparent;font-size:12.5px;color:var(--muted);line-height:1.4;user-select:none}

.opt.selected .cb{background:var(--navy);border-color:var(--navy);color:#000}
.opt-text{flex:1;min-width:0}
.opt-ctrl{display:flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0}
.opt-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;font-weight:600;line-height:1;padding:0}

.evalwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.evgroup .row span:last-child{font-family:'IBM Plex Mono';font-weight:600;color:var(--ink)}

.evgroup .row.bold span:last-child{color:var(--coral)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}

.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

.foot-brand{font-family:'IBM Plex Mono';font-size:11px;color:var(--faint);letter-spacing:.1em}

@media(max-width:640px){
  .wrap{padding:0 16px}

  .macros{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px}

  .evalwrap,.specs,.vinag-grid{grid-template-columns:1fr}
  .foot-inner{flex-direction:column;align-items:flex-start;gap:6px}

@media(max-width:400px){
  h1{font-size:clamp(32px,10vw,56px)}

}

function buildMeal(meal){
  var groups=meal.grupos.map(function(g,gi){
    var opts=g.ops.map(function(op,oi){
      var key=meal.id+'-'+gi+'-'+oi;
      var cnt=mealState[key]||0; var sel=cnt>0;
      return '<div class="opt'+(sel?' selected':'')+'" data-key="'+key+'" data-max="'+g.max+'" data-gi="'+gi+'" data-mid="'+meal.id+'" onclick="toggleOpt(this)"><div class="cb">'+(sel?'&#10003;':'')+'</div><span class="opt-text">'+op+'</span>'+(g.max>1?'<div class="opt-ctrl"><button class="opt-btn" onclick="event.stopPropagation();adjOpt(this,-1)" '+(cnt<1?'disabled':'')+'>&minus;</button><span class="opt-cnt">'+(cnt||0)+'</span><button class="opt-btn" onclick="event.stopPropagation();adjOpt(this,1)">+</button></div>':'')+'</div>';
    }).join('');
    return '<div class="pick"><div class="k">'+g.label+'</div><div class="options">'+opts+'</div></div>';
  }).join('');
  var nota=meal.nota?'<div class="note2">'+meal.nota+'</div>':'';
  return '<div class="meal" data-mealid="'+meal.id+'"><div class="top"><span class="nm">'+meal.nombre+'</span><span class="mac"><b>'+meal.kcal+'</b> kcal &middot; '+meal.p+'P / '+meal.c+'C / '+meal.g+'G</span></div><div class="body">'+groups+nota+'</div></div>';
}

function toggleOpt(el){
  var key=el.dataset.key; var cur=mealState[key]||0;
  mealState[key]=cur>0?0:1; saveMealState(mealState); renderNutr();
}
function adjOpt(btn,delta){
  var opt=btn.closest('.opt'); var key=opt.dataset.key; var cur=mealState[key]||0;
  mealState[key]=Math.max(0,cur+delta); saveMealState(mealState); renderNutr();
}

n('')+'</ul></div></section></div>';

var ANTRO_KEY=function(){return PATIENT.slug+'-antro-v1';};
function getAntroBase(){
  var a=PATIENT.antro;
  var s6=a.s6!=null?a.s6:+(a.tri+a.sub+a.supra+a.abd+a.pierna+a.pant).toFixed(1);
  var s8=a.s8!=null?a.s8:+(s6+a.bi+a.cresta).toFixed(1);
  var cur={fecha:a.fecha,peso:a.peso,tri:a.tri,bi:a.bi,sub:a.sub,cresta:a.cresta,supra:a.supra,abd:a.abd,pierna:a.pierna,pant:a.pant,brazRelaj:a.brazRelaj,brazFlex:a.brazFlex,abdom:a.abdom,cadera:a.cadera,muslo:a.muslo,pantPer:a.pantPer,s6:s6,s8:s8};
  var hist=(PATIENT.antroHistorial||[]).map(function(h){
    var hs6=h.s6!=null?h.s6:+(h.tri+h.sub+h.supra+h.abd+h.pierna+h.pant).toFixed(1);
    var hs8=h.s8!=null?h.s8:+(hs6+h.bi+h.cresta).toFixed(1);
    return {fecha:h.fecha,peso:h.peso,tri:h.tri,bi:h.bi,sub:h.sub,cresta:h.cresta,supra:h.supra,abd:h.abd,pierna:h.pierna,pant:h.pant,brazRelaj:h.brazRelaj,brazFlex:h.brazFlex,abdom:h.abdom,cadera:h.cadera,muslo:h.muslo,pantPer:h.pantPer,s6:hs6,s8:hs8};
  });
  return hist.concat([cur]);
}
function getAntroData(){ try{ var r=localStorage.getItem(ANTRO_KEY()); return r?JSON.parse(r):getAntroBase(); }catch(e){ return getAntroBase(); } }
function saveAntroData(d){ localStorage.setItem(ANTRO_KEY(),JSON.stringify(d)); }

Chart.defaults.color='#666';
Chart.defaults.borderColor='rgba(255,255,255,0.07)';
Chart.defaults.font.family="IBM Plex Mono,monospace";
Chart.defaults.font.size=11;
var CC={gold:'#C4973A',cyan:'#4fc3f7',coral:'#ef9a9a',green:'#a5d6a7',purple:'#ce93d8'};

function mkChart(id,labels,datasets){
  var ctx=$(id); if(!ctx)return;
  if(ctx._ch)ctx._ch.destroy();
  ctx._ch=new Chart(ctx,{type:'line',data:{labels:labels,datasets:datasets.map(function(d){return Object.assign({tension:.35,pointRadius:5,borderWidth:2,fill:false,spanGaps:true},d);})},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,padding:14,color:'#888'}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#666'}},y:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#666'}}}}});
}

function renderAntro(){
  var el=$('tab-evol-antro'); if(!el)return;
  el.innerHTML='<div class="wrap"><section style="padding-top:24px"><div class="sec-h"><span class="ix">01</span><h2>Evolucion Antropometrica</h2><div class="rule"></div></div><div class="kpi-row" id="antroKpis"></div></section><section style="padding-top:0"><div class="sec-h"><span class="ix">02</span><h2>Graficos</h2><div class="rule"></div></div><div class="chart-card"><h3>Peso corporal</h3><div class="cap">kg</div><div class="chart-wrap"><canvas id="cPeso"></canvas></div></div><div class="chart-grid"><div class="chart-card"><h3>Sumatorias de pliegues</h3><div class="cap">S6 y S8 (mm)</div><div class="chart-wrap"><canvas id="cSigma"></canvas></div></div><div class="chart-card"><h3>Perimetros musculares</h3><div class="cap">Brazo flex, muslo, pantorrilla (cm)</div><div class="chart-wrap"><canvas id="cMusc"></canvas></div></div><div class="chart-card"><h3>Cintura y cadera</h3><div class="cap">Perimetros (cm)</div><div class="chart-wrap"><canvas id="cCint"></canvas></div></div><div class="chart-card"><h3>Pliegues individuales</h3><div class="cap">Abdominal, cresta, subescapular (mm)</div><div class="chart-wrap"><canvas id="cPl"></canvas></div></div></div></section><section style="padding-top:0"><div class="sec-h"><span class="ix">03</span><h2>Historial</h2><div class="rule"></div></div><div class="tbl-scroll"><table class="antro-table" id="antroTable"></table></div></section><section style="padding-top:0"><div class="sec-h"><span class="ix">04</span><h2>Nueva medicion</h2><div class="rule"></div></div><div class="eval-form"><h3>Registrar evaluacion</h3><div class="form-grid"><div class="form-field"><label>Fecha</label><input type="date" id="f-fecha"></div><div class="form-field"><label>Peso (kg)</label><input type="number" step="0.1" id="f-peso" placeholder="—"></div><div class="form-field"><label>Tricipital (mm)</label><input type="number" step="0.5" id="f-tri"></div><div class="form-field"><label>Bicipital (mm)</label><input type="number" step="0.5" id="f-bi"></div><div class="form-field"><label>Subescapular</label><input type="number" step="0.5" id="f-sub"></div><div class="form-field"><label>Cresta iliaca</label><input type="number" step="0.5" id="f-cresta"></div><div class="form-field"><label>Supra espinal</label><input type="number" step="0.5" id="f-supra"></div><div class="form-field"><label>Abdominal (mm)</label><input type="number" step="0.5" id="f-abd"></div><div class="form-field"><label>Pierna media</label><input type="number" step="0.5" id="f-pierna"></div><div class="form-field"><label>Pantorrilla pl.</label><input type="number" step="0.5" id="f-pant"></div><div class="form-field"><label>Brazo relajado</label><input type="number" step="0.1" id="f-brazRelaj"></div><div class="form-field"><label>Brazo flex.</label><input type="number" step="0.1" id="f-brazFlex"></div><div class="form-field"><label>Cintura (cm)</label><input type="number" step="0.1" id="f-abdom"></div><div class="form-field"><label>Cadera (cm)</label><input type="number" step="0.1" id="f-cadera"></div><div class="form-field"><label>Muslo medio</label><input type="number" step="0.1" id="f-muslo"></div><div class="form-field"><label>Pantorrilla per.</label><input type="number" step="0.1" id="f-pantPer"></div></div><button class="btn-add" onclick="addAntroEntry()">+ Guardar medicion</button></div></section></div>';
  drawAntroCharts();
}

function drawAntroCharts(){
  var data=getAntroData(); var lbl=data.map(function(d){return d.fecha;});
  var first=data[0],last=data[data.length-1];
  var kpis=[
    {v:last.peso,u:'kg',l:'Peso actual',d:+(last.peso-first.peso).toFixed(1),good:'down'},
    {v:last.s8,u:'mm',l:'S8 pliegues',d:+(last.s8-first.s8).toFixed(1),good:'down'},
    {v:last.brazFlex,u:'cm',l:'Brazo flex.',d:+(last.brazFlex-first.brazFlex).toFixed(1),good:'up'},
    {v:last.abdom,u:'cm',l:'Cintura',d:+(last.abdom-first.abdom).toFixed(1),good:'down'},
  ];
  $('antroKpis').innerHTML=kpis.map(function(k){
    var sign=k.d>0?'+':''; var cls=(k.good==='down'?k.d<0:k.d>0)?'up':(k.d<0?'down':'');
    var arr=k.d>0?'▲':(k.d<0?'▼':'—');
    return '<div class="kpi"><div class="kv">'+k.v+'<span style="font-size:14px;opacity:.5"> '+k.u+'</span></div><div class="kl">'+k.l+'</div>'+(data.length>1?'<div class="kd '+cls+'">'+arr+' '+sign+k.d+' '+k.u+'</div>':'')+'</div>';
  }).join('');
  mkChart('cPeso',lbl,[{label:'Peso kg',data:data.map(function(d){return d.peso;}),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cSigma',lbl,[{label:'S6',data:data.map(function(d){return d.s6;}),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'S8',data:data.map(function(d){return d.s8;}),borderColor:CC.purple,pointBackgroundColor:CC.purple}]);
  mkChart('cMusc',lbl,[{label:'Brazo flex',data:data.map(function(d){return d.brazFlex;}),borderColor:CC.green,pointBackgroundColor:CC.green},{label:'Muslo',data:data.map(function(d){return d.muslo;}),borderColor:CC.cyan,pointBackgroundColor:CC.cyan},{label:'Pantorrilla',data:data.map(function(d){return d.pantPer;}),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cCint',lbl,[{label:'Cintura',data:data.map(function(d){return d.abdom;}),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Cadera',data:data.map(function(d){return d.cadera;}),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cPl',lbl,[{label:'Abdominal',data:data.map(function(d){return d.abd;}),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Cresta',data:data.map(function(d){return d.cresta;}),borderColor:CC.gold,pointBackgroundColor:CC.gold},{label:'Subescapular',data:data.map(function(d){return d.sub;}),borderColor:CC.cyan,pointBackgroundColor:CC.cyan}]);
  var cols=['fecha','peso','s6','s8','brazFlex','muslo','abdom','cadera'];
  var heads=['Fecha','Peso kg','S6 mm','S8 mm','Brazo cm','Muslo cm','Cintura cm','Cadera cm'];
  $('antroTable').innerHTML='<thead><tr>'+heads.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+[].concat(data).reverse().map(function(d){return '<tr>'+cols.map(function(c){return '<td>'+(d[c]!=null?d[c]:'—')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody>';
}

function addAntroEntry(){
  var gf=function(id){var e=$(id);return e?e.value||null:null;};
  var gn=function(id){var e=$(id);return e?parseFloat(e.value)||null:null;};
  var fecha=gf('f-fecha'); if(!fecha){alert('Ingresa la fecha');return;}
  var e={fecha:fecha.split('-').reverse().join('.'),peso:gn('f-peso'),tri:gn('f-tri'),bi:gn('f-bi'),sub:gn('f-sub'),cresta:gn('f-cresta'),supra:gn('f-supra'),abd:gn('f-abd'),pierna:gn('f-pierna'),pant:gn('f-pant'),brazRelaj:gn('f-brazRelaj'),brazFlex:gn('f-brazFlex'),abdom:gn('f-abdom'),cadera:gn('f-cadera'),muslo:gn('f-muslo'),pantPer:gn('f-pantPer')};
  e.s6=+[e.tri,e.sub,e.supra,e.abd,e.pierna,e.pant].filter(Boolean).reduce(function(a,b){return a+b;},0).toFixed(1);
  e.s8=+(e.s6+(e.bi||0)+(e.cresta||0)).toFixed(1);
  var data=getAntroData(); data.push(e); saveAntroData(data);
  antroInited=false; initAntro();
  ['fecha','peso','tri','bi','sub','cresta','supra','abd','pierna','pant','brazRelaj','brazFlex','abdom','cadera','muslo','pantPer'].forEach(function(f){var el=$('f-'+f);if(el)el.value='';});
  flashSave();
}

function flashSave(){
  clearTimeout(saveTimer);
  var el=$('saveind'); el.classList.add('show'); $('saveTxt').textContent='Guardado';
  saveTimer=setTimeout(function(){el.classList.remove('show');},1800);
}

function init(){
  renderHero();
  renderTabs();
  renderNutr();
  renderEval();
  renderSpecs();
}

init();
