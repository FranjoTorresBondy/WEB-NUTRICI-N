function showTab(id,btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  $('tab-'+id)?.classList.add('active');
  btn.classList.add('active');
}

function getAntroBase() {
  const a = PATIENT.antro;
  const pl = [a.tri,a.sub,a.supra,a.abd,a.pierna,a.pant];
  const s6 = pl.every(v=>v!=null) ? +(pl.reduce((x,y)=>x+y,0)).toFixed(1) : null;
  const s8 = s6!=null && a.bi!=null && a.cresta!=null ? +(s6+a.bi+a.cresta).toFixed(1) : null;
  const current = { fecha:a.fecha, peso:a.peso, tri:a.tri, bi:a.bi, sub:a.sub, cresta:a.cresta, supra:a.supra, abd:a.abd, pierna:a.pierna, pant:a.pant, brazRelaj:a.brazRelaj, brazFlex:a.brazFlex, abdom:a.abdom, cadera:a.cadera, muslo:a.muslo, pantPer:a.pantPer, s6, s8 };
  return [...(PATIENT.antroHistorial||[]), current];
}

function mkChart(id,labels,datasets) {
  const ctx=$(id); if(!ctx)return;
  if(ctx._ch)ctx._ch.destroy();
  ctx._ch=new Chart(ctx,{type:'line',data:{labels,datasets:datasets.map(d=>({tension:.35,pointRadius:5,borderWidth:2,fill:false,spanGaps:true,...d}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,padding:14,color:'#888'}},tooltip:{mode:'index',intersect:false}},
    scales:{x:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#666'}},y:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#666'}}}}});
}

function drawAntroCharts() {
  const data=getAntroData(); const lbl=data.map(d=>d.fecha);
  const first=data[0],last=data[data.length-1];
  const kpis=[
    {v:last.peso,u:'kg',l:'Peso actual',d:+(last.peso-first.peso).toFixed(1),good:'down'},
    {v:last.s8,u:'mm',l:'Σ8 pliegues',d:+(last.s8-first.s8).toFixed(1),good:'down'},
    {v:last.brazFlex,u:'cm',l:'Brazo flex.',d:+(last.brazFlex-first.brazFlex).toFixed(1),good:'up'},
    {v:last.abdom,u:'cm',l:'Cintura',d:+(last.abdom-first.abdom).toFixed(1),good:'down'},
  ];
  $('antroKpis').innerHTML=kpis.map(k=>{
    const sign=k.d>0?'+':''; const cls=(k.good==='down'?k.d<0:k.d>0)?'up':(k.d<0?'down':'');
    const arr=k.d>0?'▲':(k.d<0?'▼':'—');
    return `<div class="kpi"><div class="kv">${k.v}<span style="font-size:14px;opacity:.5"> ${k.u}</span></div><div class="kl">${k.l}</div>${data.length>1?`<div class="kd ${cls}">${arr} ${sign}${k.d} ${k.u}</div>`:''}</div>`;
  }).join('');
  mkChart('cPeso',lbl,[{label:'Peso kg',data:data.map(d=>d.peso),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cSigma',lbl,[{label:'Σ6',data:data.map(d=>d.s6),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Σ8',data:data.map(d=>d.s8),borderColor:CC.purple,pointBackgroundColor:CC.purple}]);
  mkChart('cMusc',lbl,[{label:'Brazo flex',data:data.map(d=>d.brazFlex),borderColor:CC.green,pointBackgroundColor:CC.green},{label:'Muslo',data:data.map(d=>d.muslo),borderColor:CC.cyan,pointBackgroundColor:CC.cyan},{label:'Pantorrilla',data:data.map(d=>d.pantPer),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cCint',lbl,[{label:'Cintura',data:data.map(d=>d.abdom),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Cadera',data:data.map(d=>d.cadera),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cPl',lbl,[{label:'Abdominal',data:data.map(d=>d.abd),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Cresta',data:data.map(d=>d.cresta),borderColor:CC.gold,pointBackgroundColor:CC.gold},{label:'Subescapular',data:data.map(d=>d.sub),borderColor:CC.cyan,pointBackgroundColor:CC.cyan}]);
  const cols=['fecha','peso','s6','s8','brazFlex','muslo','abdom','cadera'];
  const heads=['Fecha','Peso kg','Σ6 mm','Σ8 mm','Brazo cm','Muslo cm','Cintura cm','Cadera cm'];
  $('antroTable').innerHTML=`<thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`+[...data].reverse().map(d=>`<tr>${cols.map(c=>`<td>${d[c]??'—'}</td>`).join('')}</tr>`).join('')+'</tbody>';
}

function addAntroEntry() {
  const gf=id=>{const e=$(id);return e?e.value||null:null};
  const gn=id=>{const e=$(id);return e?parseFloat(e.value)||null:null};
  const fecha=gf('f-fecha'); if(!fecha){alert('Ingresa la fecha');return;}
  const e={fecha:fecha.split('-').reverse().join('.'),peso:gn('f-peso'),tri:gn('f-tri'),bi:gn('f-bi'),sub:gn('f-sub'),cresta:gn('f-cresta'),supra:gn('f-supra'),abd:gn('f-abd'),pierna:gn('f-pierna'),pant:gn('f-pant'),brazRelaj:gn('f-brazRelaj'),brazFlex:gn('f-brazFlex'),abdom:gn('f-abdom'),cadera:gn('f-cadera'),muslo:gn('f-muslo'),pantPer:gn('f-pantPer')};
  e.s6=+[e.tri,e.sub,e.supra,e.abd,e.pierna,e.pant].filter(Boolean).reduce((a,b)=>a+b,0).toFixed(1);
  e.s8=+(e.s6+(e.bi||0)+(e.cresta||0)).toFixed(1);
  const data=getAntroData(); data.push(e); saveAntroData(data);
  antroInited=false; initAntro();
  ['fecha','peso','tri','bi','sub','cresta','supra','abd','pierna','pant','brazRelaj','brazFlex','abdom','cadera','muslo','pantPer'].forEach(f=>{const el=$('f-'+f);if(el)el.value='';});
  flashSave();
}

function initOpts(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.dataset.count='0';
    const cb=opt.querySelector('.cb');
    const textSpan=document.createElement('span');textSpan.className='opt-text';
    Array.from(opt.childNodes).forEach(n=>{if(n!==cb)textSpan.appendChild(n);});
    opt.appendChild(textSpan);
    const ctrl=document.createElement('span');ctrl.className='opt-ctrl';
    ctrl.innerHTML=`<button class="opt-btn opt-dec" tabindex="-1">−</button><span class="opt-cnt">0</span><button class="opt-btn opt-inc" tabindex="-1">+</button>`;
    opt.appendChild(ctrl);
    ctrl.querySelector('.opt-dec').addEventListener('click',e=>{e.stopPropagation();decrOpt(opt);});
    ctrl.querySelector('.opt-inc').addEventListener('click',e=>{e.stopPropagation();incrOpt(opt);});
    opt.addEventListener('click',()=>incrOpt(opt));
    updateOpt(opt);
  });
}
function groupTotal(g){let t=0;g.querySelectorAll('.opt').forEach(o=>t+=parseInt(o.dataset.count||0));return t;}
function incrOpt(opt){const g=opt.closest('.options');const max=parseInt(g.dataset.max)||1;if(groupTotal(g)>=max)return;opt.dataset.count=parseInt(opt.dataset.count||0)+1;updateOpt(opt);saveSelections();}
function decrOpt(opt){const c=parseInt(opt.dataset.count||0);if(c<=0)return;opt.dataset.count=c-1;updateOpt(opt);saveSelections();}
function updateOpt(opt){const c=parseInt(opt.dataset.count||0);opt.classList.toggle('selected',c>0);const cb=opt.querySelector('.cb');if(cb)cb.textContent=c>0?c:'';const cnt=opt.querySelector('.opt-cnt');if(cnt)cnt.textContent=c;const dec=opt.querySelector('.opt-dec');if(dec)dec.disabled=c<=0;}

function planKey(){return `${PATIENT.slug}-plan-s1`;}
function saveSelections(){const data={};document.querySelectorAll('.options').forEach(g=>{const gid=g.dataset.group;data[gid]={};g.querySelectorAll('.opt').forEach((o,i)=>{const c=parseInt(o.dataset.count||0);if(c>0)data[gid][i]=c;});});localStorage.setItem(planKey(),JSON.stringify(data));}
function loadSelections(){const raw=localStorage.getItem(planKey());document.querySelectorAll('.opt').forEach(o=>{o.dataset.count='0';updateOpt(o);});if(!raw)return;try{const data=JSON.parse(raw);document.querySelectorAll('.options').forEach(g=>{const gid=g.dataset.group;if(!data[gid])return;const opts=g.querySelectorAll('.opt');Object.entries(data[gid]).forEach(([idx,count])=>{if(opts[idx]){opts[idx].dataset.count=count;updateOpt(opts[idx]);}});});}catch(e){}}

function flashSave(){const ind=$('saveind');if(!ind)return;$('saveTxt').textContent='Guardado';ind.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>ind.classList.remove('show'),1800);}

const WEIGHT_KEY  = `${PATIENT.slug}-weight-v1`;
const PHOTOS_KEY  = `${PATIENT.slug}-photos-v1`;
let seguimientoInited = false;

function getWeightData()   { try { const r=localStorage.getItem(WEIGHT_KEY);  return r?JSON.parse(r):[]; } catch { return []; } }

function initSeguimiento() { if(seguimientoInited)return; seguimientoInited=true; renderSeguimiento(); }

  const todayVal = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  el.innerHTML=`<div class="wrap">

      </div>

function linReg(pts) {
  const n=pts.length; if(n<2)return null;
  let sx=0,sy=0,sxy=0,sx2=0;
  pts.forEach((p,i)=>{sx+=i;sy+=p;sxy+=i*p;sx2+=i*i;});
  const slope=(n*sxy-sx*sy)/(n*sx2-sx*sx);
  return {slope, intercept:(sy-slope*sx)/n};
}
function movingAvg(data,w) {
  return data.map((_,i)=>{
    const sl=data.slice(Math.max(0,i-w+1),i+1);
    return +(sl.reduce((a,b)=>a+b,0)/sl.length).toFixed(2);
  });
}

function drawWeightChart() {
  const data=getWeightData(); data.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const labels=data.map(d=>d.fecha.split('-').reverse().join('.'));
  const weights=data.map(d=>d.peso);
  const ctx=$('cWeight'); if(!ctx)return;
  if(ctx._ch)ctx._ch.destroy();
  const ds=[{label:'Peso kg',data:weights,borderColor:CC.gold,pointBackgroundColor:CC.gold,pointRadius:4,borderWidth:2,tension:.3,fill:false,spanGaps:true}];
  if(weights.length>=3){
    const r=linReg(weights);
    ds.push({label:'Tendencia',data:weights.map((_,i)=>+(r.intercept+r.slope*i).toFixed(2)),borderColor:'rgba(196,151,58,.4)',borderDash:[6,4],pointRadius:0,borderWidth:2,tension:0,fill:false});
  }
  if(weights.length>=7){
    ds.push({label:'Media 7d',data:movingAvg(weights,7),borderColor:CC.cyan,pointRadius:0,borderWidth:1.5,tension:.4,fill:false});
  }
  ctx._ch=new Chart(ctx,{type:'line',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{boxWidth:12,padding:14,color:'#888'}},tooltip:{mode:'index',intersect:false}},
    scales:{x:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#666',maxTicksLimit:12}},
      y:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#666'},
        suggestedMin:weights.length?Math.min(...weights)-1:74,
        suggestedMax:weights.length?Math.max(...weights)+1:84}}}});
  const cap=$('weightCap'); if(!cap)return;
  if(!weights.length){ cap.textContent='Sin registros aún'; }
  else if(weights.length===1){ cap.textContent=weights[0]+' kg'; }
  else {
    const diff=+(weights[weights.length-1]-weights[0]).toFixed(1);
    const r=linReg(weights);
    cap.textContent=`${data.length} registros · ${diff>0?'+':''}${diff} kg total · ${r.slope*7>0?'+':''}${+(r.slope*7).toFixed(2)} kg/semana`;
  }
  drawWeightTable(data);
}

function drawWeightTable(data) {
  const tbl=$('weightTable'); if(!tbl)return;
  const s=[...data].reverse();
  if(!s.length){ tbl.innerHTML='<tr><td style="color:var(--faint);padding:16px;font-size:13px;text-align:left">Sin registros todavía.</td></tr>'; return; }
  tbl.innerHTML=`<thead><tr><th style="text-align:left">Fecha</th><th>Peso</th><th>Cambio</th><th></th></tr></thead><tbody>`+
    s.map((d,i)=>{
      const prev=s[i+1];
      const diff=prev?+(d.peso-prev.peso).toFixed(1):null;
      const dc=diff!=null?`<span class="${diff>0?'pos':'neg'}">${diff>0?'+':''}${diff}</span>`:'—';
      return `<tr><td>${d.fecha.split('-').reverse().join('.')}</td><td>${d.peso} kg</td><td>${dc}</td><td><button class="del-btn" onclick="deleteWeight('${d.fecha}')">✕</button></td></tr>`;
    }).join('')+'</tbody>';
}

function addWeight() {
  const fecha=$('w-fecha')?.value;
  const peso=parseFloat($('w-peso')?.value);
  if(!fecha||isNaN(peso)){alert('Completa fecha y peso');return;}
  const data=getWeightData();
  const idx=data.findIndex(d=>d.fecha===fecha);
  if(idx>=0){data[idx].peso=peso;}else{data.push({fecha,peso});}
  saveWeightData(data); drawWeightChart(); flashSave();
}
function deleteWeight(fecha) { saveWeightData(getWeightData().filter(d=>d.fecha!==fecha)); drawWeightChart(); flashSave(); }

function compressImage(file,cb) {
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=900; let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function handlePhotoFiles(files) {
  Array.from(files).forEach(file=>{
    compressImage(file,src=>{
      const today=new Date(); const pad=n=>n<10?'0'+n:String(n);
      const photos=getPhotosData();
      photos.unshift({id:`${Date.now()}_${Math.random().toString(36).slice(2)}`,src,fecha:`${today.getDate()}.${today.getMonth()+1}.${today.getFullYear()}`});
      try{savePhotosData(photos);}catch(e){alert('Almacenamiento lleno.');return;}
      drawPhotoGrid(); flashSave();
    });
  });
  const pi=$('photoInput'); if(pi)pi.value='';
}
function handlePhotoDrop(e) { e.preventDefault(); $('photoDropZone')?.classList.remove('drag'); handlePhotoFiles(e.dataTransfer.files); }
function deletePhoto(id)     { savePhotosData(getPhotosData().filter(p=>p.id!==id)); drawPhotoGrid(); flashSave(); }
function openLightbox(src)   { const lb=document.createElement('div'); lb.className='photo-lightbox'; lb.innerHTML=`<img src="${src}">`; lb.onclick=()=>document.body.removeChild(lb); document.body.appendChild(lb); }
function drawPhotoGrid() {
  const grid=$('photoGrid'); if(!grid)return;
  const photos=getPhotosData(); updateStorageInfo();
  if(!photos.length){grid.innerHTML='<div style="color:var(--faint);font-size:13px;padding:16px 0">Aún no hay fotos.</div>';return;}
  grid.innerHTML=photos.map(p=>`<div class="photo-item">
    <img src="${p.src}" loading="lazy" style="cursor:zoom-in" onclick="openLightbox('${p.src}')">
    <div class="pi-foot"><span class="pi-date">${p.fecha}</span><button class="pi-del" onclick="deletePhoto('${p.id}')">✕</button></div>
  </div>`).join('');
}
function updateStorageInfo() {
  const info=$('storageInfo'); if(!info)return;
  try {
    let used=0;
    [WEIGHT_KEY,PHOTOS_KEY,ANTRO_KEY()].forEach(k=>{const v=localStorage.getItem(k);if(v)used+=v.length*2;});
    const pct=Math.min(100,Math.round(used/5e6*100));
    info.innerHTML=`<div class="storage-bar"><div class="storage-bar-fill" style="width:${pct}%"></div></div><div class="storage-label">Almacenamiento: ${(used/1e6).toFixed(2)} MB de ~5 MB · ${pct}%</div>`;
  } catch(e){}
}
