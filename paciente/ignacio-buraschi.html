function showTab(id, btn) {

}

function flashSave() {
  const el=$('saveind'); if(!el)return;

function buildMeal(meal) {
  const isPre=meal.id==='pre';
  const groups=meal.grupos.map((g,gi)=>{
    const opts=g.ops.map((op,oi)=>{
      const key=`${meal.id}-${gi}-${oi}`;
      const cnt=(mealState[key]||0);
      const sel=cnt>0;
      return `<div class="opt${sel?' selected':''}" data-key="${key}" onclick="toggleOpt(this)">
        <div class="cb">${sel?'✓':''}</div>
        <span class="opt-text">${op}</span>
        ${g.max>1?`<div class="opt-ctrl">
          <button class="opt-btn" onclick="event.stopPropagation();adjOpt(this,-1)" ${cnt<1?'disabled':''}>−</button>
          <span class="opt-cnt">${cnt||0}</span>
          <button class="opt-btn" onclick="event.stopPropagation();adjOpt(this,1)">+</button>
        </div>`:''}
      </div>`;
    }).join('');
    return `<div class="pick"><div class="k">${g.label}</div><div class="options">${opts}</div></div>`;
  }).join('');
  const nota=meal.nota?`<div class="note2">${meal.nota.replace(/\n/g,'<br>')}</div>`:'';
  const badge=isPre?`<div class="pre-badge">⚡ +200 kcal · Solo días de entrenamiento</div>`:'';
  return `<div class="meal${isPre?' pre-entreno':''}" data-mealid="${meal.id}"><div class="top">
    <span class="nm">${meal.nombre}</span>
    <span class="mac"><b>${meal.kcal}</b> kcal · ${meal.p}P / ${meal.c}C / ${meal.g}G</span>
  </div><div class="body">${badge}${groups}${nota}</div></div>`;
}

function toggleOpt(el){
  const key=el.dataset.key;if(!key)return;
  mealState[key]=(mealState[key]||0)>0?0:1;
  saveMealState(mealState);renderNutr();
}
function adjOpt(btn,delta){
  const key=btn.closest('.opt').dataset.key;
  mealState[key]=Math.max(0,(mealState[key]||0)+delta);
  saveMealState(mealState);renderNutr();
}

const ANTRO_KEY=()=>`${PATIENT.slug}-antro-v1`;
function getAntroBase(){
  const a=PATIENT.antro;
  const s6=a.s6??+(a.tri+a.sub+a.supra+a.abd+a.pierna+a.pant).toFixed(1);
  const s8=a.s8??+(s6+a.bi+a.cresta).toFixed(1);
  const cur={fecha:a.fecha,peso:a.peso,tri:a.tri,bi:a.bi,sub:a.sub,cresta:a.cresta,supra:a.supra,abd:a.abd,pierna:a.pierna,pant:a.pant,brazRelaj:a.brazRelaj,brazFlex:a.brazFlex,abdom:a.abdom,cadera:a.cadera,muslo:a.muslo,pantPer:a.pantPer,s6,s8};
  const hist=(PATIENT.antroHistorial||[]).map(h=>{const hs6=h.s6??+(h.tri+h.sub+h.supra+h.abd+h.pierna+h.pant).toFixed(1);const hs8=h.s8??(hs6&&h.bi?+(hs6+h.bi+h.cresta).toFixed(1):null);return{...h,s6:hs6,s8:hs8};});
  return hist.concat([cur]);
}
function getAntroData(){
  const base=getAntroBase();let stored=[];
  try{const r=localStorage.getItem(ANTRO_KEY());if(r)stored=JSON.parse(r)||[];}catch{}
  const seen={};base.forEach(d=>{seen[d.fecha]=1;});
  stored.forEach(d=>{if(d&&d.fecha&&!seen[d.fecha]){seen[d.fecha]=1;base.push(d);}});
  return base;
}
function saveAntroData(d){localStorage.setItem(ANTRO_KEY(),JSON.stringify(d));}

        <button class="btn-add" onclick="addAntroEntry()">+ Guardar medición</button>
      </div>
    </section>
  </div>`;
  drawAntroCharts();
}

function drawAntroCharts(){
  const data=getAntroData();const lbl=data.map(d=>d.fecha);
  const first=data[0],last=data[data.length-1];
  const kpis=[
    {v:last.peso,u:'kg',l:'Peso actual',d:data.length>1?+(last.peso-first.peso).toFixed(1):null,good:'down'},
    {v:last.s8,u:'mm',l:'Σ8 pliegues',d:data.length>1?+(last.s8-first.s8).toFixed(1):null,good:'down'},
    {v:last.brazFlex,u:'cm',l:'Brazo flex.',d:data.length>1?+(last.brazFlex-first.brazFlex).toFixed(1):null,good:'up'},
    {v:last.abdom,u:'cm',l:'Cintura',d:data.length>1?+(last.abdom-first.abdom).toFixed(1):null,good:'down'},
  ];
  $('antroKpis').innerHTML=kpis.map(k=>{
    if(!k.v)return`<div class="kpi"><div class="kv" style="font-size:18px;color:var(--faint)">—</div><div class="kl">${k.l}</div></div>`;
    const sign=k.d>0?'+':'';const cls=k.d==null?'':(k.good==='down'?k.d<0:k.d>0)?'up':(k.d<0?'down':'');
    const arr=k.d>0?'▲':(k.d<0?'▼':'—');
    return`<div class="kpi"><div class="kv">${k.v}<span style="font-size:14px;opacity:.5"> ${k.u}</span></div><div class="kl">${k.l}</div>${k.d!=null&&data.length>1?`<div class="kd ${cls}">${arr} ${sign}${k.d} ${k.u}</div>`:''}</div>`;
  }).join('');
  mkChart('cPeso',lbl,[{label:'Peso kg',data:data.map(d=>d.peso),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cSigma',lbl,[{label:'Σ6',data:data.map(d=>d.s6),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Σ8',data:data.map(d=>d.s8),borderColor:CC.purple,pointBackgroundColor:CC.purple}]);
  mkChart('cMusc',lbl,[{label:'Brazo flex',data:data.map(d=>d.brazFlex),borderColor:CC.green,pointBackgroundColor:CC.green},{label:'Muslo',data:data.map(d=>d.muslo),borderColor:CC.cyan,pointBackgroundColor:CC.cyan},{label:'Pantorrilla',data:data.map(d=>d.pantPer),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cCint',lbl,[{label:'Cintura',data:data.map(d=>d.abdom),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Cadera',data:data.map(d=>d.cadera),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cPl',lbl,[{label:'Tricipital',data:data.map(d=>d.tri),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Abdominal',data:data.map(d=>d.abd),borderColor:CC.purple,pointBackgroundColor:CC.purple},{label:'Pierna',data:data.map(d=>d.pierna),borderColor:CC.cyan,pointBackgroundColor:CC.cyan}]);
  const cols=['fecha','peso','s6','s8','abdom','cadera','brazFlex','muslo','pantPer'];
  const heads=['Fecha','Peso kg','Σ6','Σ8','Cintura','Cadera','Braz.Flex','Muslo','Pant.'];
  const tbl=$('antroTable');
  if(tbl)tbl.innerHTML=`<thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${data.map(d=>`<tr>${cols.map(c=>`<td>${d[c]??'—'}</td>`).join('')}</tr>`).join('')}</tbody>`;
}

function addAntroEntry(){
  const get=id=>{const v=($('f-'+id)||{}).value;return v?+v:null;};
  const fecha=($('f-fecha')||{}).value;
  if(!fecha){alert('Ingresa la fecha');return;}
  const tri=get('tri'),bi=get('bi'),sub=get('sub'),cresta=get('cresta'),supra=get('supra'),abd=get('abd'),pierna=get('pierna'),pant=get('pant');
  const s6=(tri&&sub&&supra&&abd&&pierna&&pant)?+(tri+sub+supra+abd+pierna+pant).toFixed(1):null;
  const s8=(s6&&bi&&cresta)?+(s6+bi+cresta).toFixed(1):null;
  const entry={fecha,peso:get('peso'),tri,bi,sub,cresta,supra,abd,pierna,pant,brazRelaj:get('brazRelaj'),brazFlex:get('brazFlex'),abdom:get('abdom'),cadera:get('cadera'),muslo:get('muslo'),pantPer:get('pantPer'),s6,s8};
  const allStored=[];
  try{const r=localStorage.getItem(ANTRO_KEY());if(r)JSON.parse(r).forEach(d=>allStored.push(d));}catch{}
  const base=getAntroBase().map(d=>d.fecha);
  const filtered=allStored.filter(d=>!base.includes(d.fecha)&&d.fecha!==entry.fecha);
  filtered.push(entry);saveAntroData(filtered);drawAntroCharts();flashSave();
}
