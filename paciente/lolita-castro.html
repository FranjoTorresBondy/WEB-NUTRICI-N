let currentMicro=1, saveTimer=null;
function initOpts(){
  document.querySelectorAll('.opt').forEach(opt=>{
    opt.dataset.count='0';const cb=opt.querySelector('.cb');
    const ts=document.createElement('span');ts.className='opt-text';
    Array.from(opt.childNodes).forEach(n=>{if(n!==cb)ts.appendChild(n);});opt.appendChild(ts);
    const ctrl=document.createElement('span');ctrl.className='opt-ctrl';
    ctrl.innerHTML=`<button class="opt-btn opt-dec" tabindex="-1">−</button><span class="opt-cnt">0</span><button class="opt-btn opt-inc" tabindex="-1">+</button>`;
    opt.appendChild(ctrl);
    ctrl.querySelector('.opt-dec').addEventListener('click',e=>{e.stopPropagation();decrOpt(opt);});
    ctrl.querySelector('.opt-inc').addEventListener('click',e=>{e.stopPropagation();incrOpt(opt);});
    opt.addEventListener('click',()=>incrOpt(opt));updateOpt(opt);
  });
}
function groupTotal(g){let t=0;g.querySelectorAll('.opt').forEach(o=>t+=parseInt(o.dataset.count||0));return t;}
function incrOpt(opt){const g=opt.closest('.options');const max=parseInt(g.dataset.max)||1;if(groupTotal(g)>=max)return;opt.dataset.count=parseInt(opt.dataset.count||0)+1;updateOpt(opt);saveSelections();}
function decrOpt(opt){const c=parseInt(opt.dataset.count||0);if(c<=0)return;opt.dataset.count=c-1;updateOpt(opt);saveSelections();}
function updateOpt(opt){const c=parseInt(opt.dataset.count||0);opt.classList.toggle('selected',c>0);const cb=opt.querySelector('.cb');if(cb)cb.textContent=c>0?c:'';const cnt=opt.querySelector('.opt-cnt');if(cnt)cnt.textContent=c;const dec=opt.querySelector('.opt-dec');if(dec)dec.disabled=c<=0;}
function planKey(){return `${PATIENT.slug}-plan-s${currentMicro}`;}
function saveSelections(){const data={};document.querySelectorAll('.options').forEach(g=>{const gid=g.dataset.group;data[gid]={};g.querySelectorAll('.opt').forEach((o,i)=>{const c=parseInt(o.dataset.count||0);if(c>0)data[gid][i]=c;});});try{localStorage.setItem(planKey(),JSON.stringify(data));}catch(e){}}
function loadSelections(){try{const raw=localStorage.getItem(planKey());document.querySelectorAll('.opt').forEach(o=>{o.dataset.count='0';updateOpt(o);});if(!raw)return;const data=JSON.parse(raw);document.querySelectorAll('.options').forEach(g=>{const gid=g.dataset.group;if(!data[gid])return;const opts=g.querySelectorAll('.opt');Object.entries(data[gid]).forEach(([idx,count])=>{if(opts[idx]){opts[idx].dataset.count=count;updateOpt(opts[idx]);}});});}catch(e){}}
function flashSave(){const ind=$('saveind');if(!ind)return;$('saveTxt').textContent='Guardado';ind.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>ind.classList.remove('show'),1800);}

const ANTRO_KEY = () => `${PATIENT.slug}-antro-v1`;
function getAntroData() {
  const base = [{ fecha:PATIENT.antro.fecha, peso:PATIENT.antro.peso }];
  let stored = [];
  try{const r=localStorage.getItem(ANTRO_KEY());if(r)stored=JSON.parse(r)||[];}catch(e){}
  const seen = {}; base.forEach(d=>{seen[d.fecha]=1;});
  stored.forEach(d=>{if(d&&d.fecha&&!seen[d.fecha]){seen[d.fecha]=1;base.push(d);}});
  return base;
}
function saveAntroData(d){try{localStorage.setItem(ANTRO_KEY(),JSON.stringify(d));}catch(e){}}

function mkChart(id,labels,datasets){

function drawCharts(){
  const data=getAntroData();const lbl=data.map(d=>d.fecha);
  const first=data[0],last=data[data.length-1];
  const d=+(last.peso-first.peso).toFixed(1);const sign=d>0?'+':'';
  const cls=d<0?'up':d>0?'down':'';const arr=d>0?'▲':d<0?'▼':'—';
  $('antroKpis').innerHTML=`<div class="kpi"><div class="kv">${last.peso}<span style="font-size:14px;opacity:.5"> kg</span></div><div class="kl">Peso actual</div>${data.length>1?`<div class="kd ${cls}">${arr} ${sign}${d} kg</div>`:''}</div>

    <div class="kpi"><div class="kv">50.0<span style="font-size:14px;opacity:.5"> kg</span></div><div class="kl">Peso objetivo</div></div>`;
  mkChart('cPeso',lbl,[{label:'Peso kg',data:data.map(d=>d.peso),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  $('antroTable').innerHTML=`<thead><tr><th style="text-align:left">Fecha</th><th>Peso kg</th></tr></thead><tbody>`+
    [...data].reverse().map(d=>`<tr><td>${d.fecha}</td><td>${d.peso??'—'}</td></tr>`).join('')+'</tbody>';
}

function addEntry(){
  const gf=id=>{const e=$(id);return e?e.value||null:null};

  const fecha=gf('f-fecha');if(!fecha){alert('Ingresa la fecha');return;}
  const e={fecha:fecha.split('-').reverse().join('.'),peso:gn('f-peso')};
  const data=getAntroData();data.push(e);saveAntroData(data);
  antroInited=false;initAntro();
  ['fecha','peso'].forEach(f=>{const el=$('f-'+f);if(el)el.value='';});
  flashSave();
}
