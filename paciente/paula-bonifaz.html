header.hero{padding:60px 0 22px}

h1{font-family:'Chakra Petch',sans-serif;font-weight:700;line-height:1.02;font-size:clamp(40px,7vw,84px);margin:14px 0 6px;color:#fff;letter-spacing:.02em;text-transform:uppercase}

.tab{appearance:none;background:none;border:none;cursor:pointer;font-family:'Inter';font-weight:600;font-size:14px;letter-spacing:.01em;color:var(--muted);padding:17px 22px;position:relative;transition:color .25s;display:flex;align-items:center;gap:10px;flex-shrink:0;white-space:nowrap}

.tab.active{color:var(--navy)}
.tab.active::after{content:"";position:absolute;left:22px;right:22px;bottom:-1px;height:3px;background:var(--navy);border-radius:3px 3px 0 0}
.panel{display:none;animation:fade .5s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{padding:30px 0}
.sec-h{display:flex;align-items:baseline;gap:16px;margin:8px 0 20px}
.sec-h h2{font-family:'Libre Franklin',sans-serif;font-weight:600;font-size:24px}
.sec-h .ix{font-family:'IBM Plex Mono';color:var(--navy);font-size:13px;font-weight:600}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.macros{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:6px 0 22px;box-shadow:var(--shadow)}
.macros .kcal{font-family:'Libre Franklin',sans-serif;font-weight:600;font-size:32px;color:var(--amber)}
.macros .kcal small{font-size:14px;color:var(--muted);font-family:'Inter';font-weight:600}
.macros .mtag{font-family:'IBM Plex Mono';font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--ink)}

.macros .sep{flex:1}
.tag{display:inline-block;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#000;background:var(--navy);padding:5px 12px;border-radius:999px;font-weight:700}
.meals{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

.meal .top .mac{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
.meal .top .mac b{color:var(--amber)}
.meal .body{padding:14px 20px 18px}
.pick{margin:10px 0}

.opt{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;transition:.15s;border:1.5px solid transparent;font-size:12.5px;color:var(--muted);line-height:1.4;user-select:none}
.opt:hover{background:var(--bg2)}
.opt.selected{background:rgba(196,151,58,.1);border-color:rgba(196,151,58,.3);color:var(--ink)}
.opt .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;background:var(--panel);font-family:'IBM Plex Mono';font-size:11px;font-weight:700}
.opt.selected .cb{background:var(--navy);border-color:var(--navy);color:#000}
.opt-text{flex:1;min-width:0}
.opt-ctrl{display:flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0}
.opt-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;font-weight:600;line-height:1;padding:0}
.opt-btn:hover{border-color:var(--navy);color:var(--navy)}

.evalwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.evgroup .row span:last-child{font-family:'IBM Plex Mono';font-weight:600;color:var(--ink)}

.evgroup .row.bold span:last-child{color:var(--coral)}

.obj li{font-size:13.5px;color:var(--ink);margin:8px 0 8px 4px;list-style:none;padding-left:22px;position:relative}
.obj li::before{content:"→";position:absolute;left:0;color:var(--navy);font-weight:800}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

.spec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.spec h4{font-family:'Libre Franklin',sans-serif;font-size:15px;font-weight:600;color:var(--navy);margin-bottom:10px}
.spec ul{list-style:none}

.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.form-field label{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px}

.antro-table th:first-child{text-align:left}
.antro-table td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;font-family:'IBM Plex Mono';color:var(--ink)}
.antro-table td:first-child{text-align:left;color:var(--muted)}
.antro-table tr:last-child td{border-bottom:none;color:var(--navy);font-weight:700}
.tbl-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
footer{padding:40px 0;border-top:1px solid var(--line);margin-top:20px}
.foot-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.foot-brand{font-family:'IBM Plex Mono';font-size:11px;color:var(--faint);letter-spacing:.1em}
.foot-contact{font-size:12px;color:var(--faint)}
@media(max-width:640px){
  .wrap{padding:0 16px}
  header.hero{padding:32px 0 16px}
  section{padding:20px 0}

  .tab.active::after{left:14px;right:14px}
  .tab .tnum{font-size:10px}
  .macros{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px}
  .macros .sep{display:none}
  .macros .kcal{font-size:26px}
  .evalwrap,.specs{grid-template-columns:1fr}
  .foot-inner{flex-direction:column;align-items:flex-start;gap:6px}
}
</style>

function showTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));

  $('tab-'+id)?.classList.add('active');

}

// ── Opciones de comida ──────────────────────────────────────────────────────
function initOpts() {
  document.querySelectorAll('.options').forEach(grp => {
    grp.querySelectorAll('.opt').forEach((opt,i) => {
      opt.addEventListener('click', () => toggleOpt(grp, opt, i));
    });
  });
}

function toggleOpt(grp, opt, i) {
  const max = parseInt(grp.dataset.max)||1;
  const sel = [...grp.querySelectorAll('.opt.selected')];
  if(opt.classList.contains('selected')) {
    opt.classList.remove('selected');
    opt.querySelector('.cb').textContent='';
  } else {
    if(sel.length>=max) {
      sel[0].classList.remove('selected');
      sel[0].querySelector('.cb').textContent='';
    }
    opt.classList.add('selected');
    opt.querySelector('.cb').textContent='✓';
  }
  saveSelections();
}

function saveSelections() {
  try {
    const state={};
    document.querySelectorAll('.options').forEach(grp => {
      state[grp.dataset.group]=[];
      grp.querySelectorAll('.opt').forEach((opt,i)=>{
        if(opt.classList.contains('selected')) state[grp.dataset.group].push(i);
      });
    });
    localStorage.setItem(planKey(), JSON.stringify(state));
    flashSave();
  } catch(e){}
}

function loadSelections() {
  try {
    const raw = localStorage.getItem(planKey());
    if(!raw) return;
    const state = JSON.parse(raw);
    Object.entries(state).forEach(([group, idxs]) => {
      const grp = document.querySelector(`.options[data-group="${group}"]`);
      if(!grp) return;
      idxs.forEach(i => {
        const opt = grp.querySelectorAll('.opt')[i];
        if(opt) { opt.classList.add('selected'); opt.querySelector('.cb').textContent='✓'; }
      });
    });
  } catch(e){}
}

const ANTRO_KEY = () => `${PATIENT.slug}-antro-v1`;
function getAntroBase() {
  const a = PATIENT.antro;
  const s6 = +(a.tri+a.sub+a.supra+a.abd+a.pierna+a.pant).toFixed(1);
  const s8 = +(s6+a.bi+a.cresta).toFixed(1);
  return [{ fecha:a.fecha, peso:a.peso, tri:a.tri, bi:a.bi, sub:a.sub, cresta:a.cresta, supra:a.supra, abd:a.abd, pierna:a.pierna, pant:a.pant, brazRelaj:a.brazRelaj, brazFlex:a.brazFlex, abdom:a.abdom, cadera:a.cadera, muslo:a.muslo, pantPer:a.pantPer, s6, s8 }];
}
function getAntroData() {
  const base = getAntroBase();
  let stored = [];
  try { const r=localStorage.getItem(ANTRO_KEY()); if(r) stored=JSON.parse(r)||[]; } catch{}
  const seen=new Set(base.map(d=>d.fecha));
  stored.forEach(d=>{ if(d?.fecha&&!seen.has(d.fecha)){seen.add(d.fecha);base.push(d);} });
  return base;
}
function saveAntroData(d) { try { localStorage.setItem(ANTRO_KEY(), JSON.stringify(d)); } catch{} }

function mkChart(id,labels,datasets){
  const ctx=$(id); if(!ctx)return;
  if(ctx._ch)ctx._ch.destroy();
  ctx._ch=new Chart(ctx,{type:'line',data:{labels,datasets:datasets.map(d=>({tension:.35,pointRadius:5,borderWidth:2,fill:false,spanGaps:true,...d}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,padding:14,color:'#888'}},tooltip:{mode:'index',intersect:false}},
    scales:{x:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#666'}},y:{grid:{color:'rgba(255,255,255,0.06)'},ticks:{color:'#666'}}}}});
}

function addAntroEntry(){
  const fecha=document.getElementById('f-fecha')?.value; if(!fecha)return;

  const s8=(s6!=null&&bi!=null&&cresta!=null)?+(s6+bi+cresta).toFixed(1):null;
  const e={fecha:fecha.split('-').reverse().join('.'),peso:gn('peso'),tri,bi,sub,cresta,supra,abd,pierna,pant,s6,s8,
    abdom:gn('abdom'),cadera:gn('cadera'),muslo:gn('muslo'),brazRelaj:gn('brazRelaj'),brazFlex:gn('brazFlex'),pantPer:gn('pantPer')};
  const data=getAntroData(); data.push(e); saveAntroData(data);
  antroInited=false; initAntro();
  ['fecha','peso','tri','bi','sub','cresta','supra','abd','pierna','pant','abdom','cadera','muslo','brazRelaj','brazFlex','pantPer'].forEach(f=>{
    const el=document.getElementById('f-'+f); if(el)el.value='';
  });

}
