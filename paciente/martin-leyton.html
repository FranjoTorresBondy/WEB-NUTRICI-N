  btn.classList.add('active');

function buildMeal(meal, planId) {
  var mealKey = planId + '-' + meal.id;
  var groups = meal.grupos.map(function(g, gi) {
    var opts = g.ops.map(function(op, oi) {
      var key = mealKey + '-' + gi + '-' + oi;
      var cnt = (mealState[key]||0);
      var sel = cnt > 0;
      var ctrl = g.max > 1 ?
        '<div class="opt-ctrl">' +
        '<button class="opt-btn" onclick="event.stopPropagation();adjOpt(this,-1)"' + (cnt<1?' disabled':'') + '>−</button>' +
        '<span class="opt-cnt">' + (cnt||0) + '</span>' +
        '<button class="opt-btn" onclick="event.stopPropagation();adjOpt(this,1)">+</button></div>' : '';
      return '<div class="opt' + (sel?' selected':'') + '" data-key="' + key + '" data-max="' + g.max + '" data-gi="' + gi + '" onclick="toggleOpt(this)">' +
        '<div class="cb">' + (sel?'✓':'') + '</div>' +
        '<span class="opt-text">' + op + '</span>' + ctrl + '</div>';
    }).join('');
    return '<div class="pick"><div class="k">' + g.label + '</div><div class="options">' + opts + '</div></div>';
  }).join('');
  var nota = meal.nota ? '<div class="note2">' + meal.nota + '</div>' : '';
  var macStr = meal.kcal != null ? '<b>' + meal.kcal + '</b> kcal · ' + meal.p + 'P / ' + meal.c + 'C / ' + meal.g + 'G' : '';
  return '<div class="meal" data-mealid="' + meal.id + '"><div class="top">' +
    '<span class="nm">' + meal.nombre + '</span>' +
    (macStr ? '<span class="mac">' + macStr + '</span>' : '') +
    '</div><div class="body">' + groups + nota + '</div></div>';
}

function toggleOpt(el) {
  if (!el.dataset.key) return;
  var key = el.dataset.key;
  var cur = mealState[key]||0;
  mealState[key] = cur>0 ? 0 : 1;
  saveMealState(mealState);
  renderNutr();
}

function adjOpt(btn, delta) {
  var opt = btn.closest('.opt');
  var key = opt.dataset.key;
  var cur = mealState[key]||0;
  mealState[key] = Math.max(0, cur+delta);
  saveMealState(mealState);
  renderNutr();
}

    '<div class="form-grid">' +
    '<div class="form-field"><label>Fecha</label><input type="date" id="f-fecha"></div>' +
    '<div class="form-field"><label>Peso (kg)</label><input type="number" step="0.1" id="f-peso"></div>' +
    '<div class="form-field"><label>Tricipital (mm)</label><input type="number" step="0.5" id="f-tri"></div>' +
    '<div class="form-field"><label>Bicipital (mm)</label><input type="number" step="0.5" id="f-bi"></div>' +
    '<div class="form-field"><label>Subescapular</label><input type="number" step="0.5" id="f-sub"></div>' +
    '<div class="form-field"><label>Cresta iliaca</label><input type="number" step="0.5" id="f-cresta"></div>' +
    '<div class="form-field"><label>Supra espinal</label><input type="number" step="0.5" id="f-supra"></div>' +
    '<div class="form-field"><label>Abdominal (mm)</label><input type="number" step="0.5" id="f-abd"></div>' +
    '<div class="form-field"><label>Pierna media</label><input type="number" step="0.5" id="f-pierna"></div>' +
    '<div class="form-field"><label>Pantorrilla pl.</label><input type="number" step="0.5" id="f-pant"></div>' +
    '<div class="form-field"><label>Brazo relajado</label><input type="number" step="0.1" id="f-brazRelaj"></div>' +
    '<div class="form-field"><label>Brazo flex.</label><input type="number" step="0.1" id="f-brazFlex"></div>' +
    '<div class="form-field"><label>Cintura (cm)</label><input type="number" step="0.1" id="f-abdom"></div>' +
    '<div class="form-field"><label>Cadera (cm)</label><input type="number" step="0.1" id="f-cadera"></div>' +
    '<div class="form-field"><label>Muslo medio</label><input type="number" step="0.1" id="f-muslo"></div>' +
    '<div class="form-field"><label>Pantorrilla per.</label><input type="number" step="0.1" id="f-pantPer"></div>' +
    '</div><button class="btn-add" onclick="addAntroEntry()">+ Guardar medicion</button></div></section></div>';
  drawAntroCharts();
}

function drawAntroCharts() {
  var data=getAntroData(); var lbl=data.map(function(d){return d.fecha;});
  var first=data[0],last=data[data.length-1];
  var kpis=[
    {v:last.peso,u:'kg',l:'Peso actual',d:data.length>1?+(last.peso-first.peso).toFixed(1):null,good:'down'},
    {v:last.s8!=null?last.s8:'—',u:'mm',l:'Sigma 8 pliegues',d:null,good:'down'},
    {v:last.abdom!=null?last.abdom:'—',u:'cm',l:'Cintura',d:null,good:'down'},
    {v:last.brazFlex!=null?last.brazFlex:'—',u:'cm',l:'Brazo flexionado',d:null,good:'up'},
  ];
  $('antroKpis').innerHTML=kpis.map(function(k){
    var sign=k.d!=null&&k.d>0?'+':''; var arr=k.d!=null?(k.d>0?'▲':(k.d<0?'▼':'—')):'';
    return '<div class="kpi"><div class="kv">'+k.v+'<span style="font-size:14px;opacity:.5"> '+k.u+'</span></div>' +
      '<div class="kl">'+k.l+'</div>' + (k.d!=null?'<div style="font-size:12px;margin-top:4px;color:'+(k.d>0?'var(--coral)':'var(--green)')+'">'+arr+' '+sign+k.d+' '+k.u+'</div>':'') + '</div>';
  }).join('');
  mkChart('cPeso',lbl,[{label:'Peso kg',data:data.map(function(d){return d.peso;}),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cSigma',lbl,[{label:'Sigma 6',data:data.map(function(d){return d.s6;}),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Sigma 8',data:data.map(function(d){return d.s8;}),borderColor:CC.purple,pointBackgroundColor:CC.purple}]);
  mkChart('cMusc',lbl,[{label:'Brazo flex',data:data.map(function(d){return d.brazFlex;}),borderColor:CC.green,pointBackgroundColor:CC.green},{label:'Muslo',data:data.map(function(d){return d.muslo;}),borderColor:CC.cyan,pointBackgroundColor:CC.cyan},{label:'Pantorrilla',data:data.map(function(d){return d.pantPer;}),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cCint',lbl,[{label:'Cintura',data:data.map(function(d){return d.abdom;}),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Cadera',data:data.map(function(d){return d.cadera;}),borderColor:CC.gold,pointBackgroundColor:CC.gold}]);
  mkChart('cPl',lbl,[{label:'Abdominal',data:data.map(function(d){return d.abd;}),borderColor:CC.coral,pointBackgroundColor:CC.coral},{label:'Cresta',data:data.map(function(d){return d.cresta;}),borderColor:CC.gold,pointBackgroundColor:CC.gold},{label:'Subescapular',data:data.map(function(d){return d.sub;}),borderColor:CC.cyan,pointBackgroundColor:CC.cyan}]);
  var cols=['fecha','peso','s6','s8','brazFlex','muslo','abdom','cadera'];
  var heads=['Fecha','Peso kg','Sigma6 mm','Sigma8 mm','Brazo cm','Muslo cm','Cintura cm','Cadera cm'];
  $('antroTable').innerHTML='<thead><tr>'+heads.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+
    [].concat(data).reverse().map(function(d){return '<tr>'+cols.map(function(c){return '<td>'+(d[c]!=null?d[c]:'—')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody>';
}

function addAntroEntry() {
  function gf(id){var e=$(id);return e?e.value||null:null;}
  function gn(id){var e=$(id);return e?parseFloat(e.value)||null:null;}
  var fecha=gf('f-fecha'); if(!fecha){alert('Ingresa la fecha');return;}
  var e={fecha:fecha.split('-').reverse().join('.'),peso:gn('f-peso'),tri:gn('f-tri'),bi:gn('f-bi'),sub:gn('f-sub'),cresta:gn('f-cresta'),supra:gn('f-supra'),abd:gn('f-abd'),pierna:gn('f-pierna'),pant:gn('f-pant'),brazRelaj:gn('f-brazRelaj'),brazFlex:gn('f-brazFlex'),abdom:gn('f-abdom'),cadera:gn('f-cadera'),muslo:gn('f-muslo'),pantPer:gn('f-pantPer')};
  var vals=[e.tri,e.sub,e.supra,e.abd,e.pierna,e.pant].filter(function(x){return x!=null;});
  e.s6=vals.length===6?+vals.reduce(function(a,b){return a+b;},0).toFixed(1):null;
  e.s8=e.s6!=null&&e.bi!=null&&e.cresta!=null?+(e.s6+e.bi+e.cresta).toFixed(1):null;
  var data=getAntroData(); data.push(e); saveAntroData(data);
  antroInited=false; initAntro();
  ['fecha','peso','tri','bi','sub','cresta','supra','abd','pierna','pant','brazRelaj','brazFlex','abdom','cadera','muslo','pantPer'].forEach(function(f){var el=$('f-'+f);if(el)el.value='';});
  flashSave();
}

function flashSave() {
  clearTimeout(saveTimer);
  var el=$('saveind'); el.classList.add('show'); $('saveTxt').textContent='Guardado';
  saveTimer=setTimeout(function(){el.classList.remove('show');},1800);
}

function init() {
  renderHero();
  renderTabs();
  renderNutr();
  renderEval();
  renderSpecs();
}
init();
</script>
